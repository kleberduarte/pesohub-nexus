services:
  pesohub-frontend:
    build:
      context: ../frontend
    ports:
      - "3001:3001"
    depends_on:
      - pesohub-backend

  pesohub-backend:
    build:
      context: ../backend
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://pesohub:pesohub@postgres:5432/pesohub_nexus?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      # Ambos os hosts liberados: nesta máquina de dev a resolução de
      # "localhost" para portas do Docker é intermitente, então o navegador
      # às vezes acaba acessando o frontend via 127.0.0.1 em vez de localhost.
      CORS_ORIGIN: http://localhost:3001,http://127.0.0.1:3001
      ASAAS_API_KEY: ${ASAAS_API_KEY:-}
      ASAAS_ENV: ${ASAAS_ENV:-sandbox}
      ASAAS_BASE_URL: ${ASAAS_BASE_URL:-https://sandbox.asaas.com/api/v3}
      ASAAS_WEBHOOK_TOKEN: ${ASAAS_WEBHOOK_TOKEN:-}
    depends_on:
      - postgres
      - redis

  pesohub-worker:
    build:
      context: ../worker
    environment:
      DATABASE_URL: postgresql://pesohub:pesohub@postgres:5432/pesohub_nexus?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pesohub
      POSTGRES_PASSWORD: pesohub
      POSTGRES_DB: pesohub_nexus
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5436:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6381:6379"

volumes:
  postgres-data:
